<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>奶蛙桌宠</title>
<link rel="stylesheet" href="pet.css" />
</head>
<body>
<div id="stage">

  <!-- ── 奶蛙本体：分层 SVG 骨架，所有动作靠 transform 驱动 ──
       造型参照真实奶蛙：梨形无脖、小眼分得很开且靠近头顶、
       米白肚皮、橄榄色手脚、黏土质感的柔和渐变 ── -->
  <svg id="svg" viewBox="0 0 200 260" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="skin" cx="30%" cy="16%" r="92%">
        <stop offset="0%" stop-color="#FFE9A6" />
        <stop offset="26%" stop-color="#FDD05C" />
        <stop offset="58%" stop-color="#F7BE3E" />
        <stop offset="82%" stop-color="#EFA92A" />
        <stop offset="100%" stop-color="#D9861A" />
      </radialGradient>

      <linearGradient id="shade" x1="0.15" y1="0.2" x2="0.5" y2="1">
        <stop offset="46%" stop-color="#7A3F00" stop-opacity="0" />
        <stop offset="78%" stop-color="#7A3F00" stop-opacity=".12" />
        <stop offset="100%" stop-color="#7A3F00" stop-opacity=".3" />
      </linearGradient>

      <radialGradient id="bellyGrad" cx="50%" cy="38%" r="62%">
        <stop offset="0%" stop-color="#F8EBD5" />
        <stop offset="72%" stop-color="#F0DCC0" />
        <stop offset="100%" stop-color="#E3C69E" />
      </radialGradient>

      <linearGradient id="armGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F3B93C" />
        <stop offset="55%" stop-color="#E9A72C" />
        <stop offset="100%" stop-color="#C6A868" />
      </linearGradient>

      <linearGradient id="mouthG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3B120C" />
        <stop offset="100%" stop-color="#7A2C24" />
      </linearGradient>

      <radialGradient id="shirtGrad" cx="34%" cy="16%" r="94%">
        <stop offset="0%" stop-color="#3E577A" />
        <stop offset="42%" stop-color="#31486A" />
        <stop offset="76%" stop-color="#26374F" />
        <stop offset="100%" stop-color="#1A2637" />
      </radialGradient>

      <linearGradient id="shirtShade" x1="0.2" y1="0.05" x2="0.55" y2="1">
        <stop offset="42%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#000000" stop-opacity=".32" />
      </linearGradient>

      <radialGradient id="shG">
        <stop offset="0%" stop-color="#000" stop-opacity=".26" />
        <stop offset="100%" stop-color="#000" stop-opacity="0" />
      </radialGradient>

      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="2.2" />
      </filter>
      <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="6" />
      </filter>

      <clipPath id="bodyClip">
        <path d="M100 26 C124 26 134 40 135 58 C136 78 143 92 150 108
                 C160 132 166 160 165 188 C164 212 152 228 133 232
                 C119 236 108 235 100 235 C92 235 81 236 67 232
                 C48 228 36 212 35 188 C34 160 40 132 50 108
                 C57 92 64 78 65 58 C66 40 76 26 100 26 Z" />
      </clipPath>

      <clipPath id="armClip">
        <rect x="0" y="126" width="200" height="140" />
      </clipPath>

      <clipPath id="mouthClip">
        <path d="M70 74 Q100 67 130 74 Q127 100 100 100 Q73 100 70 74 Z" />
      </clipPath>
    </defs>

    <ellipse id="shadow" cx="100" cy="250" rx="62" ry="9" fill="url(#shG)" />

    <g id="rig">
      <g id="squash">
        <g id="bodygroup">

          <!-- 腿（粗短）+ 橄榄色脚掌 -->
          <g id="legs">
            <path d="M76 214 L72 243" stroke="#F0AE2E" stroke-width="24" stroke-linecap="round" fill="none" />
            <path d="M124 214 L128 243" stroke="#F0AE2E" stroke-width="24" stroke-linecap="round" fill="none" />
            <ellipse cx="73" cy="247" rx="15.5" ry="7.8" fill="#B29C5E" />
            <ellipse cx="127" cy="247" rx="15.5" ry="7.8" fill="#B29C5E" />
          </g>

          <!-- 身体（梨形，头身一体，没有脖子） -->
          <path id="body" d="M100 26 C124 26 134 40 135 58 C136 78 143 92 150 108
                 C160 132 166 160 165 188 C164 212 152 228 133 232
                 C119 236 108 235 100 235 C92 235 81 236 67 232
                 C48 228 36 212 35 188 C34 160 40 132 50 108
                 C57 92 64 78 65 58 C66 40 76 26 100 26 Z"
                fill="url(#skin)" />

          <!-- 黏土质感：内阴影 + 高光（全部裁进身体轮廓） -->
          <g clip-path="url(#bodyClip)">
            <rect x="0" y="0" width="200" height="260" fill="url(#shade)" />
            <ellipse cx="74" cy="58" rx="20" ry="15" fill="#FFFFFF" opacity=".4" filter="url(#softer)" />
            <ellipse cx="58" cy="152" rx="12" ry="34" fill="#FFFFFF" opacity=".2" filter="url(#softer)" />
            <ellipse cx="148" cy="196" rx="16" ry="26" fill="#8A4A00" opacity=".15" filter="url(#softer)" />
          </g>

          <!-- 米白肚皮 -->
          <ellipse id="bellyPatch" cx="100" cy="178" rx="42" ry="46" fill="url(#bellyGrad)" filter="url(#soft)" opacity="1" />

          <!-- 手臂：粗短，末端橄榄色手掌 -->
          <g id="armL">
            <path d="M60 110 C48 130 43 152 46 176"
                  stroke="url(#armGrad)" stroke-width="17" stroke-linecap="round" fill="none" />
            <ellipse cx="46" cy="184" rx="10.5" ry="11.5" fill="#B29C5E" />
          </g>
          <g id="armR">
            <path d="M140 110 C152 130 157 152 154 176"
                  stroke="url(#armGrad)" stroke-width="17" stroke-linecap="round" fill="none" />
            <ellipse cx="154" cy="184" rx="10.5" ry="11.5" fill="#B29C5E" />
          </g>

          <!-- 眼睛：小、分得很开、贴着头顶两侧，绿眼珠 + 黑瞳 -->
          <g id="eyesOpen">
            <g class="eye" style="transform-origin:80px 54px">
              <circle cx="80" cy="54" r="10.5" fill="#9CC96E" />
              <circle cx="80" cy="54.6" r="9" fill="#88BB5C" opacity=".5" />
              <circle class="pupil" cx="80.6" cy="55" r="5.9" fill="#1E180F" />
              <circle cx="77.6" cy="51.4" r="1.7" fill="#FFFFFF" opacity=".92" />
            </g>
            <g class="eye" style="transform-origin:120px 54px">
              <circle cx="120" cy="54" r="10.5" fill="#9CC96E" />
              <circle cx="120" cy="54.6" r="9" fill="#88BB5C" opacity=".5" />
              <circle class="pupil" cx="119.4" cy="55" r="5.9" fill="#1E180F" />
              <circle cx="117.6" cy="51.4" r="1.7" fill="#FFFFFF" opacity=".92" />
            </g>
          </g>

          <!-- 眼睛：笑成两条弧 -->
          <g id="eyesHappy" fill="none" stroke="#2B2114" stroke-width="4.4" stroke-linecap="round">
            <path d="M70 56 Q80 45 90 56" />
            <path d="M110 56 Q120 45 130 56" />
          </g>

          <!-- 嘴：常态（一条薄薄的横线） -->
          <g id="mouthIdle">
            <path d="M91 80 Q100 81.2 109 80" fill="none" stroke="#6B4620" stroke-width="2.5" stroke-linecap="round" />
          </g>

          <!-- 嘴：大笑（整个下半张脸张开） -->
          <g id="mouthLaugh">
            <path d="M70 74 Q100 67 130 74 Q127 100 100 100 Q73 100 70 74 Z" fill="url(#mouthG)" />
            <g clip-path="url(#mouthClip)">
              <path d="M68 72 Q100 66 132 72 L132 82 Q100 76 68 82 Z" fill="#FDF3E4" opacity=".95" />
              <ellipse cx="100" cy="96" rx="23" ry="10" fill="#C4655F" />
            </g>
          </g>

          <!-- 嘴：小口（吃东西） -->
          <g id="mouthSmall">
            <ellipse cx="100" cy="84" rx="8.5" ry="10" fill="#5B2418" />
            <ellipse cx="100" cy="92" rx="8" ry="5" fill="#C4655F" />
          </g>
        </g>
      </g>
    </g>
  </svg>

  <!-- ── 浮层：Zzz / 奶茶 / 爱心 ── -->
  <div id="fx" aria-hidden="true">
    <div id="zzz"><span>z</span><span>z</span><span>Z</span></div>
    <div id="cup">
      <svg viewBox="0 0 60 72">
        <path d="M14 18 L46 18 L41 64 Q30 70 19 64 Z" fill="#F6E3C5" stroke="#B98A5A" stroke-width="2" />
        <path d="M14 30 L46 30 L41 64 Q30 70 19 64 Z" fill="#C98B5E" opacity=".9" />
        <circle cx="26" cy="52" r="3.2" fill="#3A2418" />
        <circle cx="34" cy="57" r="3.2" fill="#3A2418" />
        <circle cx="31" cy="46" r="3.2" fill="#3A2418" />
        <path d="M36 18 L40 8 L48 6" stroke="#E05A5A" stroke-width="3.5" fill="none" stroke-linecap="round" />
        <rect x="12" y="12" width="36" height="7" rx="3.5" fill="#EFD3AE" stroke="#B98A5A" stroke-width="1.6" />
      </svg>
    </div>
    <div id="hearts"><span>♥</span><span>♥</span><span>♥</span></div>
  </div>

  <!-- ── 右键菜单 ── -->
  <div id="menu" class="hidden">
    <div class="stats">
      <div class="stat"><label>心情</label><div class="track"><i id="barMood"></i></div></div>
      <div class="stat"><label>饱腹</label><div class="track"><i id="barFull"></i></div></div>
    </div>
    <div class="grid">
      <button data-cmd="laugh">笑一个</button>
      <button data-cmd="feed">喂奶茶</button>
      <button data-cmd="sleep">去睡觉</button>
      <button data-cmd="wander">自己走走</button>
    </div>
    <div class="sizes">
      <span>大小</span>
      <button data-cmd="scale" data-value="0.75">小</button>
      <button data-cmd="scale" data-value="1">中</button>
      <button data-cmd="scale" data-value="1.3">大</button>
    </div>
    <div class="grid">
      <button data-cmd="sound">声音：开</button>
      <button data-cmd="quit" class="danger">退出</button>
    </div>
  </div>

</div>
<script src="pet.js"></script>
</body>
</html>
